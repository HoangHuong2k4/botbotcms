<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tool Lọc Mail Cát Ái Shop</title>
	<meta name="description" content="Chuyển đổi dữ liệu và lấy Mail|Pass cho Cát Ái Shop">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
	<link rel="apple-touch-icon" href="favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
	<style>
		:root {
			--primary: #7c3aed;
			--primary-light: #8b5cf6;
			--primary-glow: rgba(124, 58, 237, 0.4);
			--secondary: #ec4899;
			--accent: #06b6d4;
			--bg: #05070f;
			--surface: rgba(15, 20, 40, 0.85);
			--surface2: rgba(255, 255, 255, 0.04);
			--surface3: rgba(255, 255, 255, 0.07);
			--text: #f0f4ff;
			--text-dim: #8892b0;
			--text-muted: #4a5568;
			--border: rgba(255, 255, 255, 0.08);
			--border-focus: rgba(124, 58, 237, 0.6);
			--success: #10b981;
			--danger: #ef4444;
			--excel: #1d6f42;
			--radius-sm: 8px;
			--radius-md: 12px;
			--radius-lg: 18px;
			--radius-xl: 24px;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Inter', sans-serif;
		}

		body {
			background-color: var(--bg);
			background-image:
				radial-gradient(ellipse at 15% 10%, rgba(124, 58, 237, 0.2) 0%, transparent 50%),
				radial-gradient(ellipse at 85% 90%, rgba(236, 72, 153, 0.12) 0%, transparent 50%),
				radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.04) 0%, transparent 60%);
			color: var(--text);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 24px 16px;
			overflow-x: hidden;
		}

		.container {
			width: 100%;
			max-width: 1100px;
			animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
		}

		/* ===== HEADER ===== */
		header {
			text-align: center;
			margin-bottom: 24px;
			padding: 32px 24px 28px;
			background: var(--surface);
			backdrop-filter: blur(24px);
			border: 1px solid var(--border);
			border-radius: var(--radius-xl);
			position: relative;
			overflow: hidden;
		}

		header::before {
			content: '';
			position: absolute;
			inset: -1px;
			background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(236,72,153,0.3), rgba(6,182,212,0.2));
			border-radius: var(--radius-xl);
			z-index: -1;
			opacity: 0.6;
		}

		header::after {
			content: '';
			position: absolute;
			top: 0; left: 0; right: 0;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(124,58,237,0.8), rgba(236,72,153,0.8), transparent);
		}

		h1 {
			font-size: 2rem;
			font-weight: 700;
			background: linear-gradient(135deg, #fff 20%, var(--primary-light) 60%, var(--secondary));
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 6px;
			letter-spacing: -0.5px;
		}

		.subtitle {
			color: var(--text-dim);
			font-size: 0.9rem;
			font-weight: 400;
		}

		/* ===== CARD ===== */
		.card {
			background: var(--surface);
			backdrop-filter: blur(24px);
			border: 1px solid var(--border);
			border-radius: var(--radius-xl);
			padding: 20px;
			margin-bottom: 16px;
			position: relative;
		}

		.card-title {
			font-size: 0.72rem;
			font-weight: 600;
			color: var(--text-dim);
			text-transform: uppercase;
			letter-spacing: 1.2px;
			margin-bottom: 14px;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.card-title .dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: var(--primary-light);
			box-shadow: 0 0 8px var(--primary-light);
			flex-shrink: 0;
		}

		/* ===== PRODUCT SECTION ===== */
		.product-top-row {
			display: flex;
			gap: 10px;
			margin-bottom: 14px;
		}

		.product-input {
			flex: 1;
			background: var(--surface2);
			border: 1px solid var(--border);
			padding: 10px 14px;
			border-radius: var(--radius-md);
			color: var(--text);
			font-size: 0.9rem;
			outline: none;
			transition: all 0.2s;
			min-width: 0;
		}

		.product-input:focus {
			border-color: var(--border-focus);
			background: var(--surface3);
			box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
		}

		.btn-add-product {
			padding: 10px 16px;
			border-radius: var(--radius-md);
			font-weight: 600;
			cursor: pointer;
			border: none;
			font-size: 0.85rem;
			background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
			color: white;
			white-space: nowrap;
			display: flex;
			align-items: center;
			gap: 6px;
			transition: all 0.2s;
			flex-shrink: 0;
		}

		.btn-add-product:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 20px -4px var(--primary-glow);
			filter: brightness(1.1);
		}

		/* ===== CHIP GROUPS ===== */
		.chip-groups {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.chip-group {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.chip-group-label {
			font-size: 0.68rem;
			font-weight: 600;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 1px;
			padding-left: 2px;
		}

		.chip-group-row {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
		}

		.chip-wrap {
			display: inline-flex;
			align-items: center;
			gap: 0;
		}

		.suggestion-chip {
			background: var(--surface2);
			border: 1px solid var(--border);
			color: var(--text-dim);
			padding: 5px 12px;
			border-radius: 20px 0 0 20px;
			font-size: 0.78rem;
			cursor: pointer;
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
			user-select: none;
			font-weight: 500;
			line-height: 1.4;
			white-space: nowrap;
		}

		.suggestion-chip.no-delete {
			border-radius: 20px;
		}

		.suggestion-chip:hover {
			background: rgba(124, 58, 237, 0.12);
			color: var(--text);
			border-color: rgba(124, 58, 237, 0.4);
		}

		.suggestion-chip.active {
			background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
			color: white;
			border-color: transparent;
			box-shadow: 0 2px 10px var(--primary-glow);
		}

		.chip-delete {
			background: var(--surface2);
			border: 1px solid var(--border);
			border-left: none;
			color: var(--text-muted);
			padding: 5px 8px;
			border-radius: 0 20px 20px 0;
			font-size: 0.75rem;
			cursor: pointer;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			line-height: 1;
		}

		.chip-delete:hover {
			background: rgba(239, 68, 68, 0.15);
			color: var(--danger);
			border-color: rgba(239, 68, 68, 0.3);
		}

		/* ===== MAIN GRID ===== */
		.main-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
			margin-bottom: 16px;
		}

		@media (max-width: 768px) {
			.main-grid {
				grid-template-columns: 1fr;
			}
		}

		.io-section {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.label-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.section-label {
			font-size: 0.72rem;
			font-weight: 600;
			color: var(--text-dim);
			text-transform: uppercase;
			letter-spacing: 1px;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.count-badge {
			background: rgba(124, 58, 237, 0.12);
			color: var(--primary-light);
			padding: 3px 10px;
			border-radius: 20px;
			font-size: 0.75rem;
			font-weight: 700;
			border: 1px solid rgba(124, 58, 237, 0.2);
		}

		.count-badge.success {
			background: rgba(16, 185, 129, 0.12);
			color: var(--success);
			border-color: rgba(16, 185, 129, 0.25);
		}

		textarea {
			width: 100%;
			height: 260px;
			background: var(--surface2);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: 16px;
			color: var(--text);
			font-size: 0.88rem;
			line-height: 1.65;
			resize: none;
			transition: all 0.2s;
			outline: none;
			font-family: 'Inter', monospace;
		}

		textarea:focus {
			border-color: var(--border-focus);
			box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1), 0 0 20px rgba(124, 58, 237, 0.08);
			background: var(--surface3);
		}

		#outputData {
			cursor: default;
		}

		/* ===== CONTROLS ===== */
		.controls-card {
			background: var(--surface);
			backdrop-filter: blur(24px);
			border: 1px solid var(--border);
			border-radius: var(--radius-xl);
			padding: 16px 20px;
			margin-bottom: 16px;
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			justify-content: center;
		}

		button {
			padding: 11px 22px;
			border-radius: var(--radius-md);
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s;
			display: inline-flex;
			align-items: center;
			gap: 7px;
			border: none;
			font-size: 0.88rem;
			font-family: 'Inter', sans-serif;
		}

		.btn-convert {
			background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
			color: white;
			box-shadow: 0 6px 20px -6px var(--primary);
		}

		.btn-convert:hover {
			transform: translateY(-1px);
			box-shadow: 0 10px 28px -6px var(--primary);
			filter: brightness(1.1);
		}

		.btn-clear {
			background: var(--surface2);
			color: var(--text-dim);
			border: 1px solid var(--border);
		}

		.btn-clear:hover {
			background: var(--surface3);
			color: var(--text);
			border-color: var(--text-muted);
		}

		/* ===== ACTION BUTTONS ===== */
		.action-buttons {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
		}

		.btn-copy {
			background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
			color: white;
			justify-content: center;
		}

		.btn-copy:hover {
			transform: translateY(-1px);
			box-shadow: 0 8px 20px -6px var(--success);
		}

		.btn-excel {
			background: linear-gradient(135deg, var(--excel) 0%, #145230 100%);
			color: white;
			justify-content: center;
		}

		.btn-excel:hover {
			transform: translateY(-1px);
			box-shadow: 0 8px 20px -6px var(--excel);
		}

		.btn-copy.copied {
			background: #fff;
			color: var(--success);
		}

		/* ===== INFO CARD ===== */
		.info-card {
			background: rgba(124, 58, 237, 0.05);
			border-radius: var(--radius-lg);
			border: 1px dashed rgba(124, 58, 237, 0.3);
			padding: 14px 18px;
			font-size: 0.82rem;
			color: var(--text-dim);
			line-height: 1.6;
		}

		.info-card code {
			background: rgba(0, 0, 0, 0.3);
			padding: 2px 6px;
			border-radius: 4px;
			color: var(--primary-light);
			font-size: 0.8rem;
		}

		/* ===== SCROLLBAR ===== */
		::-webkit-scrollbar { width: 6px; height: 6px; }
		::-webkit-scrollbar-track { background: transparent; }
		::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
		::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

		/* ===== ANIMATIONS ===== */
		@keyframes fadeInUp {
			from { opacity: 0; transform: translateY(16px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.chip-wrap {
			animation: chipIn 0.2s ease;
		}

		@keyframes chipIn {
			from { opacity: 0; transform: scale(0.85); }
			to { opacity: 1; transform: scale(1); }
		}

		/* ===== RESPONSIVE ===== */
		@media (max-width: 520px) {
			h1 { font-size: 1.5rem; }
			.card { padding: 14px; }
			button { padding: 10px 16px; font-size: 0.82rem; }
		}
	</style>
</head>

<body>

	<div class="container">

		<!-- HEADER -->
		<header>
			<h1>⚡ Tool Lọc Mail</h1>
			<p class="subtitle">Cát Ái Shop · Lọc nhanh dữ liệu lấy định dạng Mail</p>
			<div style="margin-top: 16px;">
				<a href="index.html" style="color: var(--primary-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 6px 12px; border: 1px solid var(--primary-light); border-radius: 20px; display: inline-block;">← Quay lại Formatter Data</a>
			</div>
		</header>

		<!-- MAIN IO GRID -->
		<div class="main-grid">

			<!-- INPUT -->
			<div class="card io-section">
				<div class="label-row">
					<span class="section-label">
						<svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
						Dữ liệu thô
					</span>
					<span class="count-badge" id="inputCount">0 Dòng</span>
				</div>
				<textarea id="inputData" placeholder="Dán dữ liệu vào đây..."
					oninput="updateInputCount()"></textarea>
			</div>

			<!-- OUTPUT -->
			<div class="card io-section">
				<div class="label-row">
					<span class="section-label">
						<svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
						Kết quả
					</span>
					<span class="count-badge success" id="outputCount">0 Tài khoản</span>
				</div>
				<textarea id="outputData" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
				<div class="action-buttons">
					<button class="btn-copy" id="copyBtn" onclick="copyResult()">
						<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
						Copy
					</button>
				</div>
			</div>

		</div>

		<!-- CONTROLS -->
		<div class="controls-card">
			<button class="btn-convert" onclick="processData()">
				<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
				Chuyển đổi ngay
			</button>
			<button class="btn-clear" onclick="clearAll()">
				<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
				Xóa tất cả
			</button>
		</div>

		<!-- INFO -->
		<div class="info-card">
			<strong>Hướng dẫn:</strong> Dán dữ liệu thô vào, hệ thống sẽ lọc ra định dạng <code>Mail</code> (bỏ Pass).
		</div>

	</div>

	<script>
		let accountsList = [];

		// Init
		// (removed product chips logic)

		// ===== COUNTS =====
		function updateInputCount() {
			const input = document.getElementById('inputData').value.trim();
			const count = input ? input.split('\n').filter(l => l.trim()).length : 0;
			document.getElementById('inputCount').innerText = `${count} Dòng`;
		}

		// ===== PROCESS =====
		function processData() {
			const input = document.getElementById('inputData').value.trim();
			if (!input) return;

			const lines = input.split(/\r?\n/);
			let resultText = '';
			accountsList = [];
			let validCount = 0;
			lines.forEach(line => {
				if (!line.trim()) return;

				let parts = [];
				if (line.includes('|')) {
					parts = line.split('|').map(p => p.trim());
				} else {
					parts = line.trim().split(/\s+/);
				}

				if (parts.length >= 1) {
					resultText += `${parts[0]}\n`;
					validCount++;
				}
			});

			document.getElementById('outputData').value = resultText.trim();
			document.getElementById('outputCount').innerText = `${validCount} Dòng`;
			document.getElementById('outputData').scrollTop = 0;
		}

		// ===== COPY =====
		async function copyResult() {
			const output = document.getElementById('outputData').value;
			if (!output) return;
			try {
				await navigator.clipboard.writeText(output);
				const btn = document.getElementById('copyBtn');
				const orig = btn.innerHTML;
				btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Đã chép!`;
				btn.classList.add('copied');
				setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
			} catch (err) {
				console.error('Lỗi copy:', err);
			}
		}

		// ===== CLEAR =====
		function clearAll() {
			document.getElementById('inputData').value = '';
			document.getElementById('outputData').value = '';
			accountsList = [];
			updateInputCount();
			document.getElementById('outputCount').innerText = '0 Tài khoản';
		}
	</script>
</body>

</html>
